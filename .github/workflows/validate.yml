name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check version and encoding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version and encoding
        run: bash scripts/validate.sh

  test-windows:
    name: Tests on Windows (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            shell: powershell
          - name: PowerShell 7
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show the environment
        run: |
          $PSVersionTable.PSVersion
          $ExecutionContext.SessionState.LanguageMode
          (Get-CimInstance Win32_OperatingSystem).Caption

      - name: Install Pester and PSScriptAnalyzer
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: PSScriptAnalyzer
        run: |
          $findings = foreach ($path in 'src', 'tests') {
            Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          }
          if ($findings) { $findings | Format-List RuleName, Severity, ScriptName, Line, Message; exit 1 }
          'No findings.'

      - name: Pester
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  test-linux:
    # The Windows-only tests are skipped here. This checks the argument handling and the
    # "this is the Windows version" path where PowerShell runs on Linux.
    name: Tests on Linux (PowerShell 7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force

      - name: Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
