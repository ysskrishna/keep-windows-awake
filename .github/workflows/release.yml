# Create a GitHub Release when you push a version tag (e.g. v1.0.0).
#
# The release has caffeinate.ps1 and caffeinate.ps1.sha256 attached.
#
# Release body (in order):
# 1. Annotated tag message: git tag -a v1.2.3 -m "Title" -m "Longer notes..."
# 2. Else the matching ## [x.y.z] section in CHANGELOG.md (tag v1.2.3 means version 1.2.3)
# 3. Else GitHub-generated notes from commits
name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repo
        run: bash scripts/validate.sh

      - name: Check tag matches the script version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(sed -n 's/^Version:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' src/caffeinate.ps1 | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read the version from src/caffeinate.ps1" >&2
            exit 1
          fi
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match src/caffeinate.ps1 version $VERSION" >&2
            exit 1
          fi

      - name: Build release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src/caffeinate.ps1 dist/caffeinate.ps1
          (cd dist && sha256sum caffeinate.ps1 > caffeinate.ps1.sha256 && cat caffeinate.ps1.sha256)

      - name: Create GitHub release from tag / changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="Release Version ${TAG}"
          FILES=(dist/caffeinate.ps1 dist/caffeinate.ps1.sha256)

          if gh release view "$TAG" --json url &>/dev/null; then
            echo "Release for $TAG already exists; skipping."
            exit 0
          fi

          TAG_TYPE="$(git cat-file -t "$TAG" 2>/dev/null || echo "")"
          NOTES=""

          if [ "$TAG_TYPE" = "tag" ]; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG" \
              | sed '/^-----BEGIN PGP SIGNATURE-----$/,/^-----END PGP SIGNATURE-----$/d')"
          fi

          nonempty() {
            local x
            x="$(printf '%s' "$1" | tr -d '[:space:]')"
            [ -n "$x" ]
          }

          if ! nonempty "$NOTES" && [ -f CHANGELOG.md ]; then
            VERSION="${TAG#v}"
            NOTES="$(awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { emit = 1; next }
              emit && /^## / { exit }
              emit && $0 ~ /^\[[0-9A-Za-z.-]+\]: https?:\/\// { exit }
              emit { print }
            ' CHANGELOG.md)"
          fi

          if nonempty "$NOTES"; then
            printf '%s\n' "$NOTES" | gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --verify-tag --notes-file -
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --verify-tag --generate-notes
          fi
