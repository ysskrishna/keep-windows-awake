# Create a GitHub Release from the matching CHANGELOG.md version section.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate repo
        run: bash scripts/validate.sh

      - name: Check tag matches the script version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(sed -n 's/^Version:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' src/caffeinate.ps1 | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read the version from src/caffeinate.ps1" >&2
            exit 1
          fi
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match src/caffeinate.ps1 version $VERSION" >&2
            exit 1
          fi

      - name: Build release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src/caffeinate.ps1 dist/caffeinate.ps1
          (cd dist && sha256sum caffeinate.ps1 > caffeinate.ps1.sha256 && cat caffeinate.ps1.sha256)

      - name: Create GitHub release from changelog
        uses: ysskrishna/changelog-release-action@v1
        with:
          release-assets: |
            dist/caffeinate.ps1
            dist/caffeinate.ps1.sha256
